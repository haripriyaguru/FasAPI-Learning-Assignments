<!DOCTYPE html>
<html>
<head>
    <title>Text File Upload</title>
</head>

<body>

    <h1>Upload Text File</h1>

    <form action="/upload" method="post" enctype="multipart/form-data">

        <input type="file" name="file" accept=".txt" required>

        <button type="submit">Upload</button>

    </form>

    {% if content %}

        <h2>File Name:</h2>
        <p>{{ filename }}</p>

        <h2>File Content:</h2>
        <pre>{{ content }}</pre>

    {% endif %}

</body>
</html>
