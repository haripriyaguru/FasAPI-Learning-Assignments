<!DOCTYPE html>
<html>

<head>

    <title>Admin Page</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>Admin Dashboard</h1>

        <h2>Users</h2>

        <table>

            <tr>
                <th>Username</th>
                <th>Role</th>
            </tr>

            {% for user in users %}

            <tr>

                <td>
                    {{ user.username }}
                </td>

                <td>
                    {{ user.role }}
                </td>

            </tr>

            {% endfor %}

        </table>


        <div class="pagination">

            {% if page > 1 %}

                <a href="/admin?page={{ page - 1 }}">
                    Previous
                </a>

            {% endif %}


            <span>
                Page {{ page }} of {{ total_pages }}
            </span>


            {% if page < total_pages %}

                <a href="/admin?page={{ page + 1 }}">
                    Next
                </a>

            {% endif %}

        </div>


        <br>

        <a href="/logout">
            Logout
        </a>

    </div>

</body>

</html>
